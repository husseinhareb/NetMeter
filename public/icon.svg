<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- NetMeter: a dial whose arc ends in a download arrow, a needle, and an
       upload arrow. Three shapes with wide gaps, so it still reads at 22px. -->
  <rect width="1024" height="1024" rx="224" fill="#0F172A"/>

  <!-- The arrowhead reaches further left than anything reaches right, so the
       drawing is shifted to centre what the eye sees, not the pivot. -->
  <g transform="translate(26 0)">

  <!-- Dial: 215 degrees of a circle centred on the needle's pivot, from the
       right side over the top to the lower left. -->
  <path d="M 782.5 487.5 A 280 280 0 1 0 248.9 655.8"
        fill="none" stroke="#4CC2FF" stroke-width="104" stroke-linecap="round"/>

  <!-- Download: the arc's own end, continued as an arrowhead along its tangent. -->
  <polygon points="140.8,695.1 357.0,616.5 300.2,796.8"
           fill="#4CC2FF" stroke="#4CC2FF" stroke-width="24" stroke-linejoin="round"/>

  <!-- Upload. -->
  <polygon points="650,705 840,705 745,592"
           fill="#6CCB5F" stroke="#6CCB5F" stroke-width="24" stroke-linejoin="round"/>
  <rect x="707" y="690" width="76" height="130" rx="12" fill="#6CCB5F"/>

  <!-- Needle, tapered and short enough to clear the arc. -->
  <polygon points="535,579.3 489,540.7 624.8,413.2 637.0,423.4"
           fill="#F8FAFC" stroke="#F8FAFC" stroke-width="16" stroke-linejoin="round"/>
  <circle cx="512" cy="560" r="58" fill="#F8FAFC"/>
  </g>
</svg>
